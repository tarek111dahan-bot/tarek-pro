name: Build Tarek TV Pro

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tarek-tv-pro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_VERSION: '8.9.2'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          yes | sdkmanager --licenses >/dev/null || true

      - name: Locate or extract project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "settings.gradle.kts" ] && [ -d "app" ]; then
            echo "Android project found in repository root."
            exit 0
          fi

          ZIP=""

          while IFS= read -r candidate; do
            ZIP="$candidate"
            break
          done < <(
            find . \
              -maxdepth 2 \
              -type f \
              -iname '*.zip' \
              -print |
            sort
          )

          if [ -z "$ZIP" ]; then
            echo "ERROR: No Android project and no ZIP archive were found."
            find . -maxdepth 3 -type f -print | sort
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP"

          rm -rf .project-extract
          mkdir -p .project-extract

          unzip -q "$ZIP" -d .project-extract

          PROJECT_ROOT=""

          if [ -f ".project-extract/settings.gradle.kts" ]; then
            PROJECT_ROOT=".project-extract"
          else
            PROJECT_ROOT="$(
              find .project-extract \
                -type f \
                -name settings.gradle.kts \
                -print |
              head -n 1 |
              sed 's#/settings.gradle.kts$##'
            )"
          fi

          if [ -z "$PROJECT_ROOT" ] || \
             [ ! -f "$PROJECT_ROOT/app/build.gradle.kts" ]; then

            echo "ERROR: Could not detect a valid Android project inside ZIP."

            find .project-extract \
              -maxdepth 5 \
              -type f \
              -print |
            sort

            exit 1
          fi

          echo "Detected project root:"
          echo "$PROJECT_ROOT"

          cp -a "$PROJECT_ROOT/." .

          rm -rf .project-extract

      - name: Validate source tree
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          test -f \
            app/src/main/java/com/tarektv/app/TarekTvApp.kt

          test -f \
            app/src/main/java/com/tarektv/app/ui/MainActivity.kt

          test -f \
            app/src/main/java/com/tarektv/app/ui/PlayerActivity.kt

          test -f \
            app/src/main/java/com/tarektv/app/ui/IslamicActivity.kt

          test -f \
            app/src/main/java/com/tarektv/app/data/parser/M3uParser.kt

          test -f \
            app/src/main/java/com/tarektv/app/data/parser/EpgParser.kt

          test -f \
            app/src/main/java/com/tarektv/app/data/remote/XtreamApi.kt

          test -f \
            app/src/main/java/com/tarektv/app/player/MediaPlaybackService.kt

          python3 - <<'PY'
          from pathlib import Path

          root = Path("app/src/main")

          kt = list(root.rglob("*.kt"))

          assert len(kt) >= 25, (
              f"Expected multi-feature source tree, "
              f"found {len(kt)} Kotlin files"
          )

          for p in kt:
              seen = set()

              for n, line in enumerate(
                  p.read_text(encoding="utf-8").splitlines(),
                  1
              ):
                  if line.startswith("import ") and line in seen:
                      raise SystemExit(
                          f"Duplicate import: {p}:{n}: {line}"
                      )

                  seen.add(line)

          manifest = (
              root / "AndroidManifest.xml"
          ).read_text(encoding="utf-8")

          required = [
              "android.intent.category.LEANBACK_LAUNCHER",
              ".ui.PlayerActivity",
              ".ui.IslamicActivity",
              ".player.MediaPlaybackService",
          ]

          for token in required:
              assert token in manifest, (
                  f"Missing manifest feature: {token}"
              )

          print(
              f"Source validation passed: "
              f"{len(kt)} Kotlin files"
          )
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Run unit tests and build APKs
        run: |
          gradle \
            --no-daemon \
            clean \
            testDebugUnitTest \
            assembleDebug \
            assembleRelease \
            --stacktrace

      - name: Verify APK outputs
        shell: bash
        run: |
          set -euo pipefail

          test -s \
            app/build/outputs/apk/debug/app-debug.apk

          test -s \
            app/build/outputs/apk/release/app-release-unsigned.apk

          sha256sum \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            > app/build/outputs/SHA256SUMS.txt

          echo "APK verification passed."

          echo ""
          echo "SHA-256:"
          cat app/build/outputs/SHA256SUMS.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: tarek-tv-pro-2.0.1-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
