name: Build Tarek TV Pro

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tarek-tv-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Android project structure..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          chmod +x gradlew

          echo "Android project structure: OK"

      - name: Check Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Gradle wrapper..."
          ./gradlew --version

      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          echo "Cleaning project..."
          ./gradlew clean --stacktrace --no-daemon

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Building Debug APK..."
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Building Release APK..."
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Verify APK files
        shell: bash
        run: |
          set -euo pipefail

          echo "Verifying generated APK files..."

          DEBUG_APK=$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)

          RELEASE_APK=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$DEBUG_APK" ]; then
            echo "ERROR: Debug APK was not generated."
            exit 1
          fi

          if [ -z "$RELEASE_APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo "Debug APK:"
          echo "$DEBUG_APK"

          echo "Release APK:"
          echo "$RELEASE_APK"

          echo "APK verification: OK"

      - name: Generate SHA-256
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build-artifacts

          find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -exec sha256sum {} \; \
            > build-artifacts/debug-sha256.txt

          find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -exec sha256sum {} \; \
            > build-artifacts/release-sha256.txt

          echo "SHA-256 files generated."

      - name: Collect APK artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build-artifacts/debug
          mkdir -p build-artifacts/release

          cp app/build/outputs/apk/debug/*.apk \
            build-artifacts/debug/

          cp app/build/outputs/apk/release/*.apk \
            build-artifacts/release/

          echo "APK artifacts collected."

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TarekTV-Pro-debug
          path: |
            build-artifacts/debug/*.apk
            build-artifacts/debug-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: TarekTV-Pro-release
          path: |
            build-artifacts/release/*.apk
            build-artifacts/release-sha256.txt
          if-no-files-found: error
          retention-days: 30
