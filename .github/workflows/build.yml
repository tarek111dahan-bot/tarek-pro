name: Build Tarek TV Pro 1.0.0

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tarek-tv-pro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Tarek TV Pro source
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking repository..."

          if [ -f "settings.gradle.kts" ] && [ -d "app" ]; then
            echo "Android project already exists in repository root."
            exit 0
          fi

          if [ -f "TarekTV-Pro-1.0.0-FRESH.zip" ]; then
            echo "Fresh Tarek TV Pro ZIP found."
            exit 0
          fi

          echo "ERROR: Tarek TV Pro source was not found."
          echo ""
          echo "Repository contents:"
          find . -maxdepth 3 -type f | sort

          exit 1

      - name: Extract Tarek TV Pro project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "settings.gradle.kts" ] && [ -d "app" ]; then
            echo "Project already exists in repository root."
            exit 0
          fi

          echo "Extracting TarekTV-Pro-1.0.0-FRESH.zip..."

          rm -rf .project-extract
          mkdir -p .project-extract

          unzip -q "TarekTV-Pro-1.0.0-FRESH.zip" \
            -d .project-extract

          echo ""
          echo "Extracted files:"
          find .project-extract -maxdepth 5 -type f | sort

          PROJECT_ROOT=""

          if [ -f ".project-extract/settings.gradle.kts" ]; then
            PROJECT_ROOT=".project-extract"
          fi

          if [ -z "$PROJECT_ROOT" ] && \
             [ -f ".project-extract/TarekTV-Pro/settings.gradle.kts" ]; then
            PROJECT_ROOT=".project-extract/TarekTV-Pro"
          fi

          if [ -z "$PROJECT_ROOT" ]; then
            PROJECT_ROOT=$(
              find .project-extract \
                -type f \
                -name "settings.gradle.kts" \
                -print \
                | head -n 1 \
                | sed 's#/settings.gradle.kts$##'
            )
          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo ""
            echo "ERROR: settings.gradle.kts was not found inside the ZIP."
            exit 1
          fi

          echo ""
          echo "Detected Android project root:"
          echo "$PROJECT_ROOT"

          cp -a "$PROJECT_ROOT/." .

          echo ""
          echo "Project copied to repository root."

      - name: Validate Android project structure
        shell: bash
        run: |
          set -euo pipefail

          echo "Validating Android project..."

          REQUIRED_FILES=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "gradle.properties"
            "app/build.gradle.kts"
            "app/src/main/AndroidManifest.xml"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Missing required file:"
              echo "$FILE"
              exit 1
            fi

            echo "OK: $FILE"
          done

          REQUIRED_DIRECTORIES=(
            "app/src/main/java"
            "app/src/main/res"
          )

          for DIRECTORY in "${REQUIRED_DIRECTORIES[@]}"; do
            if [ ! -d "$DIRECTORY" ]; then
              echo "ERROR: Missing required directory:"
              echo "$DIRECTORY"
              exit 1
            fi

            echo "OK: $DIRECTORY"
          done

          echo ""
          echo "Android project structure validation: PASSED"

      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Gradle Wrapper..."

          if [ ! -f "gradlew" ] || \
             [ ! -f "gradlew.bat" ] || \
             [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then

            echo "Gradle Wrapper is missing."

            echo "Installing Gradle 8.13..."

            sudo apt-get update
            sudo apt-get install -y gradle

            echo "Generating Gradle Wrapper..."

            gradle wrapper \
              --gradle-version 8.13 \
              --distribution-type bin
          fi

          chmod +x gradlew

          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew was not created."
            exit 1
          fi

          if [ ! -f "gradlew.bat" ]; then
            echo "ERROR: gradlew.bat was not created."
            exit 1
          fi

          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "ERROR: gradle-wrapper.properties was not created."
            exit 1
          fi

          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR: gradle-wrapper.jar was not created."
            exit 1
          fi

          echo ""
          echo "Gradle Wrapper: PASSED"

      - name: Check Gradle
        shell: bash
        run: |
          set -euo pipefail

          echo "Gradle version:"
          ./gradlew --version

      - name: Validate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          echo "Running Gradle task validation..."

          ./gradlew tasks \
            --stacktrace \
            --no-daemon

      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          echo "Cleaning project..."

          ./gradlew clean \
            --stacktrace \
            --no-daemon

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Building Debug APK..."

          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Building Release APK..."

          ./gradlew assembleRelease \
            --stacktrace \
            --no-daemon

      - name: Verify generated APKs
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for generated APKs..."

          DEBUG_APK=$(find \
            app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1 || true)

          RELEASE_APK=$(find \
            app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1 || true)

          if [ -z "$DEBUG_APK" ]; then
            echo "ERROR: Debug APK was not generated."
            exit 1
          fi

          if [ -z "$RELEASE_APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo ""
          echo "Debug APK:"
          ls -lh "$DEBUG_APK"

          echo ""
          echo "Release APK:"
          ls -lh "$RELEASE_APK"

          echo ""
          echo "APK verification: PASSED"

      - name: Generate SHA-256
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build-artifacts

          DEBUG_APK=$(find \
            app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)

          RELEASE_APK=$(find \
            app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          sha256sum "$DEBUG_APK" \
            > build-artifacts/debug-sha256.txt

          sha256sum "$RELEASE_APK" \
            > build-artifacts/release-sha256.txt

          echo ""
          echo "Debug SHA-256:"
          cat build-artifacts/debug-sha256.txt

          echo ""
          echo "Release SHA-256:"
          cat build-artifacts/release-sha256.txt

      - name: Collect APK artifacts
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build-artifacts/debug
          rm -rf build-artifacts/release

          mkdir -p build-artifacts/debug
          mkdir -p build-artifacts/release

          cp app/build/outputs/apk/debug/*.apk \
            build-artifacts/debug/

          cp app/build/outputs/apk/release/*.apk \
            build-artifacts/release/

          echo "APK artifacts collected."

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TarekTV-Pro-1.0.0-debug
          path: |
            build-artifacts/debug/*.apk
            build-artifacts/debug-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: TarekTV-Pro-1.0.0-release
          path: |
            build-artifacts/release/*.apk
            build-artifacts/release-sha256.txt
          if-no-files-found: error
          retention-days: 30
