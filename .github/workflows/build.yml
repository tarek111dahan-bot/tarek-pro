name: Build Tarek TV Pro 1.0.0

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tarek-tv-pro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check source
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "settings.gradle.kts" ] && [ -d "app" ]; then
            echo "Android project found in repository root."
          elif [ -f "TarekTV-Pro.zip" ]; then
            echo "TarekTV-Pro.zip found."
          else
            echo "ERROR: Android project or TarekTV-Pro.zip not found."
            exit 1
          fi

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "settings.gradle.kts" ] && [ -d "app" ]; then
            echo "Project already exists in repository root."
            exit 0
          fi

          rm -rf .project-extract
          mkdir -p .project-extract

          echo "Extracting TarekTV-Pro.zip..."

          unzip -q TarekTV-Pro.zip -d .project-extract

          PROJECT_ROOT=""

          if [ -f ".project-extract/settings.gradle.kts" ]; then
            PROJECT_ROOT=".project-extract"
          elif [ -f ".project-extract/TarekTV-Pro/settings.gradle.kts" ]; then
            PROJECT_ROOT=".project-extract/TarekTV-Pro"
          else
            PROJECT_ROOT=$(find .project-extract \
              -type f \
              -name "settings.gradle.kts" \
              -print \
              | head -n 1 \
              | sed 's#/settings.gradle.kts$##')
          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          echo "Project root:"
          echo "$PROJECT_ROOT"

          cp -a "$PROJECT_ROOT/." .

          echo "Project extracted successfully."

      - name: Validate Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Validating project..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          test -d app/src/main/java
          test -d app/src/main/res

          echo "Android project structure: OK"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "gradlew" ] || \
             [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then

            echo "Gradle Wrapper missing."
            echo "Creating Gradle Wrapper 9.6.0..."

            gradle wrapper \
              --gradle-version 9.6.0 \
              --distribution-type bin
          else
            echo "Gradle Wrapper already exists."
          fi

          chmod +x gradlew

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f gradle/wrapper/gradle-wrapper.jar

          echo "Gradle Wrapper: OK"

      - name: Check Gradle
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew --version

      - name: Validate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew tasks \
            --stacktrace \
            --no-daemon

      - name: Clean
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean \
            --stacktrace \
            --no-daemon

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew assembleRelease \
            --stacktrace \
            --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          DEBUG_APK=$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1 || true)

          RELEASE_APK=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1 || true)

          if [ -z "$DEBUG_APK" ]; then
            echo "ERROR: Debug APK was not generated."
            exit 1
          fi

          if [ -z "$RELEASE_APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo "Debug APK:"
          ls -lh "$DEBUG_APK"

          echo "Release APK:"
          ls -lh "$RELEASE_APK"

          echo "APK verification: OK"

      - name: Generate SHA-256
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build-artifacts

          find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -exec sha256sum {} \; \
            > build-artifacts/debug-sha256.txt

          find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -exec sha256sum {} \; \
            > build-artifacts/release-sha256.txt

          cat build-artifacts/debug-sha256.txt
          cat build-artifacts/release-sha256.txt

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build-artifacts/debug
          mkdir -p build-artifacts/release

          cp app/build/outputs/apk/debug/*.apk \
            build-artifacts/debug/

          cp app/build/outputs/apk/release/*.apk \
            build-artifacts/release/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TarekTV-Pro-1.0.0-debug
          path: |
            build-artifacts/debug/*.apk
            build-artifacts/debug-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: TarekTV-Pro-1.0.0-release
          path: |
            build-artifacts/release/*.apk
            build-artifacts/release-sha256.txt
          if-no-files-found: error
          retention-days: 30
